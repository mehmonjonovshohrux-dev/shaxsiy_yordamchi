<!-- Supabase -> Authentication -> Email Templates -> "Reset Password" ga yopishtiring.
     Mavzu (Subject): AccSavdo: parolni tiklash kodi -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:420px;margin:0 auto;padding:24px;color:#0f172a">
  <h2 style="margin:0 0 8px">Parolni tiklash</h2>
  <p style="margin:0 0 16px;color:#475569">AccSavdo ilovasiga qaytish uchun quyidagi kodni ilovaga kiriting:</p>
  <p style="font-size:34px;font-weight:700;letter-spacing:8px;background:#eef2ff;border-radius:12px;padding:16px;text-align:center;margin:0 0 16px">{{ .Token }}</p>
  <p style="margin:0 0 8px;color:#475569">Kod qisqa vaqt amal qiladi. Uni hech kimga bermang.</p>
  <p style="margin:0;color:#94a3b8;font-size:13px">Agar buni siz so'ramagan bo'lsangiz, xatni e'tiborsiz qoldiring: parolingiz o'zgarmaydi.</p>
</div>
